<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValeSense — Registros</title>
  <link rel="stylesheet" href="../Home/Home.css">
  <link rel="stylesheet" href="../../painel-compacto.css">
</head>
<body data-login-path="../../Analista_de_dados/Login/Login.html">
  <div class="topbar">
    <div class="brand">
      <img class="brand-logo" src="../../Analista_de_dados/Dashboard/assets/Logo.svg" alt="ValeSense">
      ValeSense
    </div>
    <div class="topbar-actions">
      <a class="icon-btn" href="../Configurações/Configuracoes.html" aria-label="Configurações" title="Configurações">
        <img class="action-icon" src="../../Analista_de_dados/Dashboard/assets/Config.svg" alt="">
      </a>
      <button class="icon-btn" id="scrollTopBtn" aria-label="Voltar ao topo" title="Voltar ao topo">
        <img class="action-icon" src="../../Analista_de_dados/Dashboard/assets/Up.svg" alt="">
      </button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Alternar modo escuro" title="Ativar modo escuro" aria-pressed="false">
        <img data-theme-icon src="../../Analista_de_dados/Dashboard/assets/Lua.svg" alt="">
      </button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <nav>
        <a href="../Home/Home.html" class="nav-item">
          <img class="nav-icon" src="../../Analista_de_dados/Dashboard/assets/Home.svg" alt="">
          Home
        </a>
        <a href="../Sensores/Sensores.html" class="nav-item">
          <img class="nav-icon" src="../../Analista_de_dados/Dashboard/assets/Sensor.svg" alt="">
          sensores
        </a>
        <a href="Registros.html" class="nav-item active" aria-current="page">
          <img class="nav-icon" src="../../Analista_de_dados/Dashboard/assets/Registro.svg" alt="">
          registros
        </a>
      </nav>
    </aside>

    <main class="content">
      <section class="page-section">
        <h1 class="page-title">
          <img class="page-title-icon" src="../../Analista_de_dados/Dashboard/assets/Registro.svg" alt="">
          Registros
        </h1>
        <p class="section-subtitle">Histórico detalhado das ações realizadas no sistema.</p>

        <div class="card">
          <p class="card-label">Alertas que exigem ação</p>
          <div class="alert-row danger" id="loginAlert" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="12" y1="10" x2="12" y2="14" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
            <div>
              <p class="alert-title" id="loginAlertTitle"></p>
              <p class="alert-sub" id="loginAlertSub"></p>
            </div>
          </div>
          <p id="loginAlertEmpty" hidden>Nenhuma tentativa de login com falha registrada.</p>
        </div>

        <div class="card table-card">
          <div class="table-toolbar">
            <div class="filter-group">
              <select id="filtroAcao" aria-label="Filtrar por categoria">
                <option value="todas">Todas as ações</option>
                <option value="sensor">Sensores</option>
                <option value="usuario">Usuários</option>
                <option value="seguranca">Segurança</option>
              </select>
              <input type="date" id="filtroData" aria-label="Filtrar por data">
            </div>
            <button id="exportRegistrosBtn" class="btn-outline">Exportar CSV</button>
          </div>

          <div class="table-scroll">
            <table class="sheet-table" id="tabelaRegistros">
              <thead>
                <tr>
                  <th>Data/Hora</th>
                  <th>Usuário</th>
                  <th>Ação</th>
                  <th>Alvo</th>
                  <th>Detalhes</th>
                  <th>Categoria</th>
                </tr>
              </thead>
              <tbody id="accessLogBody">
                <tr><td colspan="6">Carregando registros...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../theme.js"></script>
  <script src="../../api-config.js"></script>
  <script src="../../api-client.js"></script>
  <script src="../../Analista_de_dados/auth-guard.js"></script>
  <script src="Registros.js"></script>
</body>
</html>
